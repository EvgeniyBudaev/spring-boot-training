spring:
  application:
    name: aggregation-grpc-server

  datasource:
    url: jdbc:postgresql://localhost:5432/tgbot
    username: postgres
    password: root
    driverClassName: org.postgresql.Driver

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # V(version)__description.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update

  grpc:
    server:
      port: 9092

server:
  port: 9091

logging:
  level:
    org.springframework: INFO